<VirtualHost *:80>
    ServerName cam.lensmann.studio

    DocumentRoot /var/www/lensmann-camera/frontend

    <Directory /var/www/lensmann-camera/frontend>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    Alias /recordings/ "/mnt/media2/Lænsmann Studio/cam/"
    <Directory "/mnt/media2/Lænsmann Studio/cam/">
        Options Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3001/api
    ProxyPassReverse /api http://127.0.0.1:3001/api
    ProxyPass /socket.io/ ws://127.0.0.1:3001/socket.io/
    ProxyPassReverse /socket.io/ ws://127.0.0.1:3001/socket.io/
    ProxyPass /live/ http://127.0.0.1:8889/
    ProxyPassReverse /live/ http://127.0.0.1:8889/

    ErrorLog ${APACHE_LOG_DIR}/lensmann-camera-error.log
    CustomLog ${APACHE_LOG_DIR}/lensmann-camera-access.log combined
</VirtualHost>
